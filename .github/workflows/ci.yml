name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: full
  # Force not building debuginfo to save space on disk.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build_and_test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2

      - name: check default features
        run: cargo check --workspace --all-targets
      - name: check all features
        run: cargo check --workspace --all-features --all-targets
      - name: clippy default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy all features
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --all-features --no-deps --document-private-items
      - name: tests
        timeout-minutes: 30
        run: cargo test --workspace --all-features --lib --bins --tests --examples
      - name: tests w/o default features
        timeout-minutes: 30
        run: cargo test --workspace --no-default-features --lib --bins --tests --examples

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: check default features
        run: cargo check --workspace --all-targets
      - name: check all features
        run: cargo check --workspace --all-features --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    # The lockfile carries known advisories that need their own dependency
    # bumps; this reports them without blocking merges until they are cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
